name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · laravel/ai ${{ matrix.ai }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        # laravel/ai reshapes its Agent contract on most 0.x minors, and an
        # incompatible signature is a compile-time fatal. Developing against a
        # single locked version hid exactly that: the suite stayed green on
        # 0.1.5 while the package could not be declared on anything newer.
        # Oldest, middle, and newest supported.
        ai: ['>=0.1 <0.2', '>=0.5 <0.6', '>=0.10 <0.11']
        exclude:
          # laravel/ai 0.1.x requires PHP ^8.4 — composer refuses this pairing,
          # so there is no combination here to exercise.
          - php: '8.3'
            ai: '>=0.1 <0.2'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.ai }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.ai }}-

      - name: Install dependencies
        run: |
          composer require "laravel/ai:${{ matrix.ai }}" --no-interaction --no-update
          composer update -W --prefer-dist --no-interaction --no-progress

      - name: Report resolved version
        run: composer show laravel/ai | grep versions

      - run: ./vendor/bin/pest

  pint:
    name: Code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: ./vendor/bin/pint --test
